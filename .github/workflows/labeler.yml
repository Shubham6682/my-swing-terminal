name: Auto-Ghost Labeler

on:
  schedule:
    # Runs at 8:00 PM IST (14:30 UTC) every day
    - cron: '30 14 * * *'
  workflow_dispatch: # Gives you a manual "Run" button

jobs:
  run-labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance gspread oauth2client pytz streamlit toml

      - name: Build Secrets File
        env:
          SECRET_DATA: ${{ secrets.GCP_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          echo "$SECRET_DATA" > .streamlit/secrets.toml
      - name: Run Script
        run: python auto_ghost_labeler.py
