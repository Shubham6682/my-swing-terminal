name: Shadow Node Harvester

on:
  schedule:
    # Runs at 08:00 UTC (1:30 PM IST) and 10:00 UTC (3:30 PM IST) Monday-Friday
    - cron: '0 8,10 * * 1-5'
  workflow_dispatch: # Allows you to test it manually

jobs:
  harvest-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytz

      - name: Run Shadow Node Scanner
        run: python background_scanner.py

      - name: Commit and Push CSV to Vault
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add nifty500_shadow_log.csv || true
          git commit -m "🤖 Shadow Node: Harvested Market Anomalies" || true
          git push || true
