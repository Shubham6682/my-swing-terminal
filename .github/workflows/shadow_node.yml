name: Shadow Node Harvester

on:
  schedule:
    # Offset by 5 minutes to avoid GitHub's massive top-of-the-hour queue (1:35 PM and 3:35 PM IST)
    - cron: '5 8,10 * * 1-5'
  workflow_dispatch: # Allows you to test it manually

jobs:
  harvest-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytz gspread oauth2client streamlit

      - name: Inject Database Credentials
        env:
          SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          echo "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Run Shadow Node Scanner
        run: python background_scanner.py
        
      # The CSV git push block has been permanently removed to protect repository health
