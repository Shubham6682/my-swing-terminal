name: Market Scanner

on:
  schedule:
    # Runs at 05:00, 08:00, and 10:00 UTC (roughly 10:30 AM, 1:30 PM, and 3:30 PM IST) Monday-Friday
    - cron: '0 5,8,10 * * 1-5'
  workflow_dispatch: # This adds a button on GitHub so you can test it manually

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Matches most Streamlit environments

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Background Scanner
        run: python background_scanner.py

      - name: Save Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_logs.csv
          git commit -m "Auto-update: New signals added" || echo "No changes to commit"
          git push
