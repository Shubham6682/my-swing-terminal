name: V3 Label Backfill Engine

on:
  workflow_dispatch: 

jobs:
  run-backfill:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Inject Streamlit Cloud Secrets
      env:
        SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS }}
      run: |
        mkdir -p .streamlit
        echo "$SECRETS_TOML" > .streamlit/secrets.toml

    - name: Execute Quantitative Backfill
      run: |
        python backfill_v3_labels.py
