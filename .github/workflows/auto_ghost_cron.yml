name: Auto Ghost Labeler (Daily Cron)

on:
  schedule:
    # Runs at 11:30 UTC every Monday through Friday
    # 11:30 UTC = 17:00 IST (5:00 PM in India)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Keeps the manual run button just in case

jobs:
  run-labeler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Inject Streamlit Cloud Secrets
      env:
        SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS }}
      run: |
        mkdir -p .streamlit
        echo "$SECRETS_TOML" > .streamlit/secrets.toml

    - name: Execute Automated Veto Labeling
      run: |
        python auto_ghost_labeler.py
